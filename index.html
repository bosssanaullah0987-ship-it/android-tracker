<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Tracker</title>
</head>
<body>
    <h1>Welcome to Device Tracker</h1>
    <p>Collecting device information...</p>

    <!-- Firebase SDK (Modular CDN versions) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyALu3lnopF7ZiB7gqmm0IW3QCerl3mReLk",
          authDomain: "android-tracker-f428b.firebaseapp.com",
          projectId: "android-tracker-f428b",
          storageBucket: "android-tracker-f428b.firebasestorage.app",
          messagingSenderId: "880746745094",
          appId: "1:880746745094:web:44752a9aa57787c727e287",
          measurementId: "G-V0BYXWGS55"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Function to collect device info and save to Firestore
        async function trackDevice() {
            try {
                const deviceInfo = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    screenWidth: window.screen.width,
                    screenHeight: window.screen.height,
                    language: navigator.language,
                    timestamp: new Date().toISOString()
                };

                // Save to Firestore collection named "devices"
                await addDoc(collection(db, "devices"), deviceInfo);
                console.log("Device info saved successfully!");
            } catch (e) {
                console.error("Error adding document: ", e);
            }
        }

        // Run the function when the page loads
        trackDevice();
    </script>
</body>
</html>
